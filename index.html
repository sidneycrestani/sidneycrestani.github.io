<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.C.</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0f1115;
      color: #fff;
      font-family: 'Manrope', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .ambient-light {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .header {
      margin-bottom: 40px;
      text-align: center;
    }

    h1 {
      font-weight: 300;
      font-size: 1.8rem;
      margin: 0;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #8899ac;
      margin-top: 8px;
    }

    /* Link Único e Robusto */
    .link-item {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.02);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 20px;
    }

    .text-box h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .text-box p {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: #aab;
    }

    .arrow {
      margin-left: auto;
      opacity: 0.5;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="ambient-light"></div>

  <div class="container">
    <div class="header">
      <h1>Sidney Crestani</h1>
      <div class="subtitle">Workspace</div>
    </div>

    <a href="editor/" class="link-item">
      <div class="icon-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
      <div class="text-box">
        <h2>Editor Clínico</h2>
        <p>Acessar ferramenta</p>
      </div>
      <div class="arrow">→</div>
    </a>

  </div>

</body>
</html>
