<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidney Crestani</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --line: #e5e5e5;
      --text-sec: #666666;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container { width: 100%; max-width: 680px; }

    /* Cabeçalho Limpo */
    header {
      margin-bottom: 40px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--fg);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
      text-transform: uppercase;
    }

    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-sec);
    }

    /* Lista */
    .list { display: flex; flex-direction: column; }

    /* Item Ativo */
    .item {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      padding: 20px 10px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--fg);
      transition: background 0.2s;
    }

    .item:hover {
      background: #f4f4f5;
      padding-left: 20px; /* Movimento sutil */
    }

    .id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #999;
    }

    .info { display: flex; flex-direction: column; gap: 4px; }
    
    .title { font-weight: 500; font-size: 1rem; }
    
    .desc { 
      font-size: 0.9rem; 
      color: var(--text-sec); 
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      background: #111;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* Item Inativo (Reservado) */
    .item.inactive {
      opacity: 0.4;
      cursor: default;
    }
    .item.inactive:hover { background: transparent; padding-left: 10px; }
    .item.inactive .tag { background: #eee; color: #999; }

    footer {
      margin-top: 60px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #999;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Sidney Crestani</h1>
      <span class="label">FERRAMENTAS MÉDICAS</span>
    </header>

    <div class="list">
      <a href="MedDraft/" class="item">
        <span class="id">01</span>
        <div class="info">
          <span class="title">MedDraft</span>
          <span class="desc">Rascunho clínico focado em privacidade e agilidade.</span>
        </div>
        <span class="tag">v1.0</span>
      </a>

      <div class="item inactive">
        <span class="id">02</span>
        <div class="info">
          <span class="title">Reservado</span>
          <span class="desc">---</span>
        </div>
        <span class="tag">---</span>
      </div>
    </div>

    <footer>
      SC © 2025
    </footer>
  </div>

</body>
</html>
